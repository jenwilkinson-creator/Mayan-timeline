  const icon = type => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">${type === 'sound' ? '<path d="M11 4L5 9H2v6h3l6 5Z"/><path d="M15 8q7 4 0 8M18 4q12 8 0 16"/>' : type === 'book' ? '<path d="M12 5Q5 1 2 5v15q5-3 10 0 5-3 10 0V5q-5-3-10 0Z"/><path d="M12 5v15"/>' : '<circle cx="12" cy="12" r="4"/><path d="M12 1v4m0 14v4M1 12h4m14 0h4M4 4l3 3m10 10 3 3M4 20l3-3M17 7l3-3"/>'}</svg>`;

  // Web Audio runs only after an explicit click. Active sound stops immediately on mute.
  function stopSound() {
    for (const oscillator of oscillators) { try { oscillator.stop(); } catch { /* Already stopped. */ } }
    oscillators.clear();
  }
  function playSound(kind) {
    if (!state.sound) return;
    const Context = window.AudioContext || window.webkitAudioContext;
    if (!Context) return;
    try {
      audioContext ||= new Context();
      void audioContext.resume().catch(() => {});
      const now = audioContext.currentTime;
      const duration = kind === 'travel' ? 6 : kind === 'arrival' ? 0.8 : 0.12;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = kind === 'travel' ? 'sawtooth' : 'sine';
      oscillator.frequency.setValueAtTime(kind === 'travel' ? 55 : kind === 'arrival' ? 160 : 520, now);
      oscillator.frequency.exponentialRampToValueAtTime(kind === 'travel' ? 220 : kind === 'arrival' ? 38 : 800, now + duration);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(kind === 'travel' ? 0.035 : 0.12, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      oscillator.connect(gain); gain.connect(audioContext.destination);
      oscillators.add(oscillator);
      oscillator.onended = () => { oscillators.delete(oscillator); oscillator.disconnect(); gain.disconnect(); };
      oscillator.start(); oscillator.stop(now + duration);
    } catch { /* Quiet mode remains usable if this browser cannot create audio. */ }
  }
  function changeSound(enabled) {
    state.sound = enabled;
    save('history-sound', String(enabled));
    if (enabled) playSound('beep'); else stopSound();
    updateChrome();
  }
  function changeMotion() {
    state.reduced = !state.reduced;
    save('history-motion', String(state.reduced));

    document.querySelector('.travel')?.classList.toggle('still', state.reduced);
    if (state.reduced) arrivalRoot.replaceChildren();
  }

  // The header stays in the DOM when screens change, preserving teacher-control focus.

    document.querySelectorAll('[data-phase]').forEach(element => {
      const phase = ['opening', 'control'].includes(state.page) ? 'mission' : ['maya-history', 'timeline'].includes(state.page) ? 'discovery' : 'journey';

  function opening() {
    return `<section class="opening">

  function controlRoom() {

  function historicalStop(stop) {

    return `<section class="stop-page">
      <div class="stop-heading"><div><span class="eyebrow">${stop.id === 'present' ? 'YOU ARE HERE' : 'TIME MACHINE STOP!'} · ${esc(stop.region)}</span><h1>${esc(stop.title)}</h1><p>${esc(stop.intro)}</p></div><div class="date-badge">${esc(stop.date)}<small>STOP ${String(number).padStart(2, '0')} / ${String(LESSON.stops.length).padStart(2, '0')}</small></div></div>
      <div class="interactive-scene ${state.showHotspots ? 'show-hotspots' : ''}">
        ${document.querySelector('#art-' + stop.id).innerHTML}

        ${stop.hotspots.map(hotspot => action('hotspot', `<span>+</span><small>${esc(hotspot.title)}</small>`, 'hotspot', `data-hotspot="${esc(hotspot.id)}" style="left:${hotspot.x}%;top:${hotspot.y}%" aria-label="Discover ${esc(hotspot.title)}" aria-pressed="false"`)).join('')}

      </div>

        ${stop.prediction ? `<div class="prediction-options">${['Yes', 'No', 'Not sure'].map(value => action('predict', value, prediction === value ? 'selected' : '', `data-answer="${value}" aria-pressed="${prediction === value}"`)).join('')}</div><small id="prediction-status" role="status">${prediction ? 'Prediction saved. We’ll check it on the timeline.' : 'Make a guess. We’ll find out together.'}</small>` : stop.check ? `<div class="prediction-options">${stop.check.options.map((option, index) => action('stop-answer', esc(option), answer === index ? 'selected' : '', `data-index="${index}" aria-pressed="${answer === index}"`)).join('')}</div><small id="stop-feedback" role="status">${answer === undefined ? 'Choose an answer, or continue the journey.' : esc(answer === stop.check.correct ? stop.check.success : stop.check.retry)}</small>` : `<p>${esc(stop.followup || (stop.id === 'maya' ? 'The Maya did not exist at just one moment in history.' : 'Discuss your ideas together, then continue.'))}</p>`}
      </div><div class="stop-actions">${action('book', `${icon('book')} Book mission`, 'secondary')}${action('continue', `${!following ? 'Explore the Maya through time' : stop.id === 'greece' ? 'Travel to Mesoamerica' : 'Travel through time'} <span>→</span>`, 'primary')}${following ? `<small class="next-destination">NEXT: ${esc(following.date)} · ${esc(following.shortTitle)}</small>` : ''}</div></div>
    </section>`;
  }
  function renderDialogue() {
    const root = document.querySelector('#dialogue-root');

    if (root.dataset.card !== (hotspot?.id || '')) {

  function closeDialogue() {

  const mayaScene = event => ({settlement:'maya',villages:'maya',writing:'maya',calendar:'maya-city',rulers:'maya-city',pyramids:'maya-city',classic:'maya-city',palenque:'maya-palenque',changing:'maya-city',contact:'maya-city',living:'maya-continuity'}[event.sceneStage] || 'maya');

  function mayaHistory() {

      <div class="maya-stage">

          <div class="maya-scale" aria-label="Linear time scale, earliest on the left and today on the right"><div class="maya-scale-line"><b id="maya-scale-progress" style="width:${position(event.year)}%"></b><i id="maya-scale-dot" style="left:${position(event.year)}%"></i></div><div class="maya-scale-ticks">${[-2000,-1000,0,1000,yearNow].map(year => `<span style="left:${position(year)}%">${year === yearNow ? 'TODAY' : year === 0 ? 'BC / AD' : year < 0 ? `${-year} BC` : `AD ${year}`}</span>`).join('')}</div></div>

      <div class="maya-controls">${action('maya-previous', state.mayaStep === 0 ? '← Maya arrival' : '← Previous event', 'secondary')}${action('book', `${icon('book')} Book mission`, 'secondary')}${action('maya-next', state.mayaStep === LESSON.mayaEvents.length - 1 ? 'Reveal the timeline →' : 'Next event →', 'primary')}</div>

  function selectMayaEvent(index) {

    document.querySelector('#maya-scale-dot').style.left = `${position(event.year)}%`;

    document.querySelector('[data-action="maya-previous"]').textContent = index === 0 ? '← Maya arrival' : '← Previous event';

  function timelineNote() {
    const year = state.focusYear;
    const stop = year === 800 ? LESSON.stops.find(s => s.id === 'vikings') : year === 1485 ? LESSON.stops.find(s => s.id === 'tudors') : year === 31 ? LESSON.stops.find(s => s.id === 'romans') : null;
    const title = year === 800 ? 'While Vikings sailed, Maya cities flourished.' : year === 1485 ? 'When the Tudor period began, Maya communities still lived in Mesoamerica.' : year === 31 ? 'While Romans lived in Europe, Maya communities existed in Mesoamerica.' : 'Different places. Shared time.';
    const prediction = stop && state.predictions[stop.id];
    return `<span class="note-icon">↔</span><div><h2>${title}</h2><p>${prediction ? `Your ${esc(stop.shortTitle)} prediction: “${esc(prediction)}”. The answer is YES. ` : ''}The Maya were not simply “before” these periods. Their histories overlapped.</p></div>`;
  }
  function timeline() {
    return `<section class="timeline-page">
      <div class="section-title"><span class="eyebrow">MISSION DISCOVERY / 03</span><h1>One timeline. <em>Many stories.</em></h1><p>The Maya story stretched across thousands of years.</p></div>
      <div class="timeline-board"><div class="timeline-label"><span>← EARLIEST</span><span>TIME MOVES FORWARD →</span></div>

          <div class="time-line" style="left:calc(210px + (100% - 210px) * ${position(state.focusYear) / 100})"><span>${state.focusYear < 0 ? `${-state.focusYear} BC` : `AD ${state.focusYear}`}</span></div>

  function renderPage(focusHeading = true) {
    const stop = currentStop();
    state.locked = null; state.preview = null; state.suppressPreview = false;
    main.innerHTML = state.page === 'opening' ? opening() : state.page === 'control' ? controlRoom() : stop ? historicalStop(stop) : state.page === 'maya-history' ? mayaHistory() : timeline();
    updateChrome();
    if (focusHeading) {
      const heading = main.querySelector('h1');
      heading?.setAttribute('tabindex', '-1');
      heading?.focus({preventScroll: true});
      window.scrollTo(0, 0);
    }
  }
  function cancelTravel() {
    clearInterval(travelTimer); travelTimer = null; state.travel = null;
    clearTimeout(arrivalTimer); arrivalRoot.replaceChildren();
    main.removeAttribute('aria-busy'); stopSound();
  }
  function go(target, animate = false) {
    if (!pages.includes(target)) return;
    closeModal(false);
    const source = state.page;
    cancelTravel();
    if (animate) {
      const destination = LESSON.stops.find(stop => stop.id === target);
      if (!destination) return;
      const destinationIndex = LESSON.stops.indexOf(destination);
      const from = LESSON.stops.find(stop => stop.id === source && stop.id !== target)?.year ?? LESSON.stops[Math.max(0, destinationIndex - 1)].year;
      startTravel(from, destination.year, target);
    } else { state.page = target; renderPage(); }
  }

  // Six seconds per jump; the final Maya jump adds one second of silent darkness.
  // Sound and motion controls never restart the clock.
  function startTravel(from, to, target) {
    state.travel = { from, to, target, begin: performance.now() };
    const finalJump = target === 'maya';
    const duration = finalJump ? 7000 : 6000;
    let silence = false;
    main.setAttribute('aria-busy', 'true');
    main.innerHTML = `<section class="travel ${state.reduced ? 'still' : ''} ${finalJump ? 'maya-jump' : ''}" aria-label="Travelling through time"><div class="warp" aria-hidden="true">${Array.from({length: 42}, (_, index) => `<i style="--angle:${index * 137.5}deg;--delay:${-(index % 13) / 3}s;--distance:${90 + index % 5 * 50}px"></i>`).join('')}</div><div class="travel-core"><span class="eyebrow">CHRONOMETER ACTIVE</span><h1 id="travel-year" tabindex="-1">${formatYear(from)}</h1><p id="travel-phrase" aria-live="polite">Hold on!</p><div class="travel-meter"><b id="travel-progress" style="width:0%"></b></div><small>DESTINATION LOCKED · ${formatYear(to)}</small></div></section>`;
    main.querySelector('h1').focus({preventScroll:true});
    playSound('travel');
    const phrases = ['Hold on!', 'Travelling backwards through history…', 'Chronometer calculating…', 'Destination approaching…', 'Prepare to stop!'];
    let phraseIndex = 0;
    travelTimer = window.setInterval(() => {
      if (!state.travel) return;
      const elapsed = performance.now() - state.travel.begin;
      const progress = Math.min(elapsed / 6000, 1);
      let year = Math.round(from + (to - from) * progress);
      if (year === 0) year = -1; // There is no year zero in BC/AD notation.
      document.querySelector('#travel-year').textContent = formatYear(year);
      document.querySelector('#travel-progress').style.width = `${progress * 100}%`;
      const nextIndex = Math.min(4, Math.floor(progress * 5));
      if (nextIndex !== phraseIndex) { document.querySelector('#travel-phrase').textContent = phrases[nextIndex]; phraseIndex = nextIndex; }
      if (finalJump && progress === 1 && !silence) {
        silence = true; stopSound();
        main.querySelector('.travel').classList.add('final-silence');
      }
      if (elapsed >= duration) {
        clearInterval(travelTimer); travelTimer = null; state.travel = null;
        main.removeAttribute('aria-busy'); stopSound(); playSound('arrival');
        state.page = target; renderPage();
        if (!state.reduced) {
          arrivalRoot.innerHTML = `<div class="arrival" role="status"><span>${finalJump ? 'DESTINATION FOUND · MESOAMERICA' : 'TIME MACHINE STOP!'}</span><b>${esc(currentStop().date)}</b></div>`;
          arrivalTimer = window.setTimeout(() => arrivalRoot.replaceChildren(), 1700);
        }
      }
    }, 40);
  }

      </div><p>Put the earliest dates on the left. Leave space for a long Maya band!</p>`;
  }
  function openModal(kind) {
    if (!state.modal) returnFocus = document.activeElement;
    state.modal = kind;
    state.preview = null; renderDialogue();
    const content = kind === 'sound' ? `<span class="eyebrow">PREPARE FOR DEPARTURE</span><h2>Sound on?</h2><p>Add a time-machine hum, rising travel tones and an arrival whoosh. You can turn sound off at any time.</p>${action('immersive', 'Yes · Immersive mode →', 'primary')}${action('quiet', 'No · Quiet mode →', 'secondary')}` : kind === 'teacher' ? teacherPanel() : kind === 'book' ? bookPanel() : `<span class="eyebrow">EARLIEST → TODAY</span><h2>All Maya events</h2><div class="milestones">${LESSON.mayaEvents.map(event => `<div><b>${esc(event.date)} · ${esc(event.title)}</b><p>${esc(event.text)}</p></div>`).join('')}</div>`;
    const label = kind === 'sound' ? 'Sound on?' : kind === 'teacher' ? 'Teacher controls' : kind === 'book' ? 'Book mission' : 'All Maya events';
    modalRoot.innerHTML = `<div class="modal-backdrop"><section class="modal ${kind === 'history' ? 'history-modal' : ''}" role="dialog" aria-modal="true" aria-label="${label}">${action('close-modal', 'Close ✕', 'close')}${content}</section></div>`;
    // Disable background interaction while the accessible dialog is open.
    [document.querySelector('header'), main, document.querySelector('footer')].forEach(element => { element.inert = true; });
    modalRoot.querySelector('.close').focus();
  }
  function closeModal(restoreFocus = true) {
    if (!state.modal) return;
    state.modal = null; modalRoot.replaceChildren();
    [document.querySelector('header'), main, document.querySelector('footer')].forEach(element => { element.inert = false; });
    if (restoreFocus && returnFocus?.isConnected) returnFocus.focus({preventScroll:true});
    returnFocus = null;
  }
  function refreshTeacher(focusedAction) {
    if (state.modal !== 'teacher') return;
    openModal('teacher');
    modalRoot.querySelector(`[data-action="${focusedAction}"]`)?.focus();
  }

  // One click handler covers mouse, touch and keyboard-activated buttons.
  document.addEventListener('click', event => {
    if (event.target.classList.contains('modal-backdrop')) { closeModal(); return; }
    const button = event.target.closest('button[data-action]');
    if (!button) return;
    switch (button.dataset.action) {
      case 'home': go('opening'); break;
      case 'enter': openModal('sound'); break;
      case 'teacher': openModal('teacher'); break;
      case 'close-modal': closeModal(); break;
      case 'immersive': changeSound(true); go('control'); break;
      case 'quiet': changeSound(false); go('control'); break;
      case 'sound': changeSound(!state.sound); refreshTeacher('sound'); break;
      case 'motion': changeMotion(); refreshTeacher('motion'); break;
      case 'answer': {
        state.answer = Number(button.dataset.index);
        document.querySelectorAll('[data-action="answer"]').forEach(option => { const selected = Number(option.dataset.index) === state.answer; option.classList.toggle('selected', selected); option.setAttribute('aria-pressed', String(selected)); });
        const feedback = document.querySelector('#quiz-feedback');
        feedback.hidden = false; feedback.textContent = state.answer === LESSON.chronologyQuestion.correct ? LESSON.chronologyQuestion.success : LESSON.chronologyQuestion.retry;
        playSound('beep'); break;
      }
      case 'begin': go(LESSON.stops[0].id); break;
      case 'continue': { const following = nextStop(currentStop()); following ? go(following.id, true) : (state.mayaStep = 0, go('maya-history')); break; }
      case 'hotspot': state.locked = currentStop().hotspots.find(h => h.id === button.dataset.hotspot); lastHotspot = button; renderDialogue(); playSound('beep'); break;
      case 'close-dialogue': closeDialogue(); break;
      case 'predict': {
        const stop = currentStop(); const value = button.dataset.answer;
        state.predictions[stop.id] = value; save(stop.prediction.key, value);
        document.querySelectorAll('[data-action="predict"]').forEach(option => { const selected = option.dataset.answer === value; option.classList.toggle('selected', selected); option.setAttribute('aria-pressed', String(selected)); });
        document.querySelector('#prediction-status').textContent = 'Prediction saved. We’ll check it on the timeline.'; break;
      }
      case 'stop-answer': {
        const stop = currentStop(); const answer = Number(button.dataset.index); state.stopAnswers[stop.id] = answer;
        document.querySelectorAll('[data-action="stop-answer"]').forEach(option => { const selected = Number(option.dataset.index) === answer; option.classList.toggle('selected', selected); option.setAttribute('aria-pressed', String(selected)); });
        document.querySelector('#stop-feedback').textContent = answer === stop.check.correct ? stop.check.success : stop.check.retry;
        playSound('beep'); break;
      }
      case 'book': openModal('book'); break;
      case 'previous': go(pages[Math.max(0, pages.indexOf(state.page) - 1)]); break;
      case 'next': go(pages[Math.min(pages.length - 1, pages.indexOf(state.page) + 1)]); break;
      case 'hotspots': state.showHotspots = !state.showHotspots; document.querySelector('.interactive-scene')?.classList.toggle('show-hotspots', state.showHotspots); closeModal(); break;
      case 'replay': { const target = state.travel?.target || (state.page === 'maya-history' ? 'maya' : currentStop()?.id === 'present' ? LESSON.stops[1].id : currentStop()?.id || LESSON.stops[1].id); go(target, true); break; }
      case 'fullscreen': {
        const promise = document.fullscreenElement ? document.exitFullscreen?.() : document.documentElement.requestFullscreen?.();
        if (promise) promise.catch(() => { const note = modalRoot.querySelector('.small-note'); if (note) note.textContent = 'Fullscreen is unavailable in this browser. Use its fullscreen menu instead.'; });
        break;
      }
      case 'restart': state.answer = null; state.stopAnswers = {}; state.mayaStep = 0; state.focusYear = 800; go('opening'); break;
      case 'timeline': go('timeline'); break;
      case 'history': state.mayaStep = 0; go('maya-history'); break;
      case 'maya-event': selectMayaEvent(Number(button.dataset.index)); break;
      case 'maya-previous': state.mayaStep === 0 ? go('maya') : selectMayaEvent(state.mayaStep - 1); break;
      case 'maya-next': state.mayaStep === LESSON.mayaEvents.length - 1 ? go('timeline') : selectMayaEvent(state.mayaStep + 1); break;
      case 'maya-list': openModal('maya-list'); break;
      case 'period': {
        const period = LESSON.periods[Number(button.dataset.index)];
        state.focusYear = period.name === 'Roman world' ? 31 : period.name === 'Viking Age' ? 800 : period.start;
        document.querySelectorAll('[data-action="period"]').forEach((row, index) => { const item = LESSON.periods[index]; const active = state.focusYear >= item.start && state.focusYear <= item.end; row.classList.toggle('highlight', active); row.setAttribute('aria-pressed', String(active)); });
        const line = document.querySelector('.time-line'); line.style.left = `calc(210px + (100% - 210px) * ${position(state.focusYear) / 100})`; line.firstElementChild.textContent = state.focusYear < 0 ? `${-state.focusYear} BC` : `AD ${state.focusYear}`;
        document.querySelector('#timeline-note').innerHTML = timelineNote(); break;
      }
    }
  });
  document.addEventListener('change', event => {
    if (event.target.id === 'destination-select') go(event.target.value);
  });
  function previewHotspot(event) {
    const button = event.target.closest('.hotspot');
    if (!button || state.modal || state.suppressPreview) return;
    state.preview = currentStop()?.hotspots.find(hotspot => hotspot.id === button.dataset.hotspot);
    renderDialogue();
  }
  document.addEventListener('pointerover', event => {
    const button = event.target.closest('.hotspot');
    if (button && !button.contains(event.relatedTarget)) { state.suppressPreview = false; previewHotspot(event); }
  });
  document.addEventListener('pointerout', event => {
    const button = event.target.closest('.hotspot');
    if (button && !button.contains(event.relatedTarget)) { state.preview = null; state.suppressPreview = false; renderDialogue(); }
  });
  document.addEventListener('focusin', previewHotspot);
  document.addEventListener('focusout', event => {
    if (event.target.closest('.hotspot')) { state.preview = null; state.suppressPreview = false; renderDialogue(); }
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') { if (state.modal) closeModal(); else closeDialogue(); }
    if (!state.modal && state.page === 'maya-history' && event.target.matches('[data-action="maya-event"]') && ['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) {
      event.preventDefault();
      const current = Number(event.target.dataset.index);
      const index = event.key === 'Home' ? 0 : event.key === 'End' ? LESSON.mayaEvents.length - 1 : Math.max(0, Math.min(LESSON.mayaEvents.length - 1, current + (event.key === 'ArrowRight' ? 1 : -1)));
      selectMayaEvent(index); document.querySelector(`[data-action="maya-event"][data-index="${index}"]`).focus();
    }
    if (event.key !== 'Tab' || !state.modal) return;
    const focusable = Array.from(modalRoot.querySelectorAll('button, select, [tabindex="0"]'));
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });
  window.addEventListener('pagehide', () => { clearInterval(travelTimer); clearTimeout(arrivalTimer); stopSound(); });
  renderPage(false);
})();
